<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JExTile Gantt</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111212;--surf:#222323;--sub:#2d2f2f;--hi:#383a3a;
  --acc:#22d3ee;--acc2:rgba(34,211,238,.15);
  --txt:#f8fafc;--txt2:#cbd5e1;--txt3:#94a3b8;
  --red:#ef4444;--grn:#22c55e;--org:#f97316;--blu:#3b82f6;
  --lw:320px;--rh:36px;--hh:32px
}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--txt);
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;font-size:13px
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--hi);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#4a4c4c}

/* ── Toolbar ── */
#toolbar{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;background:var(--surf);
  border-bottom:1px solid var(--sub);flex-shrink:0;min-height:44px
}
.logo{font-weight:700;font-size:15px;color:var(--acc);letter-spacing:-.3px;margin-right:4px}
.logo-sub{font-size:12px;color:var(--txt3);margin-right:4px}
.btn{
  padding:4px 10px;border-radius:5px;border:1px solid var(--sub);
  background:var(--bg);color:var(--txt2);cursor:pointer;
  font-size:12px;font-family:inherit;transition:all .15s
}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.act{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.sep{width:1px;height:20px;background:var(--sub);margin:0 2px}
.spacer{flex:1}
.zg{display:flex;border:1px solid var(--sub);border-radius:5px;overflow:hidden}
.zb{
  padding:4px 10px;background:var(--bg);border:none;
  color:var(--txt3);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s
}
.zb.act{background:var(--acc2);color:var(--acc)}
.zb:hover:not(.act){color:var(--txt2)}

/* ── Main Layout ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── Left Panel ── */
#lp{
  width:var(--lw);min-width:var(--lw);
  display:flex;flex-direction:column;
  border-right:1px solid var(--sub);flex-shrink:0;overflow:hidden
}
#lh{
  display:flex;align-items:center;height:var(--hh);
  background:var(--surf);border-bottom:1px solid var(--sub);
  flex-shrink:0;padding:0 2px
}
.lhc{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;padding:0 6px}
#lb{flex:1;overflow-y:auto;overflow-x:hidden}

/* ── Left Rows ── */
.lrow{
  display:flex;align-items:center;height:var(--rh);
  border-bottom:1px solid var(--sub);cursor:pointer;
  transition:background .1s
}
.lrow:hover{background:rgba(255,255,255,.025)}
.lrow.sel{background:rgba(34,211,238,.07)}
.lrow.crit .lc-name{color:var(--red)}
.lc-name{flex:1;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--txt)}
.lc-who{width:80px;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--txt2)}
.lc-dur{width:42px;text-align:center;font-size:12px;color:var(--txt3)}
.lc-pct{width:36px;text-align:center;font-size:12px;color:var(--txt3)}
.lc-del{width:28px;display:flex;align-items:center;justify-content:center}
.delbtn{
  background:none;border:none;color:var(--txt3);cursor:pointer;
  width:20px;height:20px;border-radius:3px;
  font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center
}
.delbtn:hover{color:var(--red);background:rgba(239,68,68,.12)}
.cinput{
  background:var(--surf);border:1px solid var(--acc);border-radius:3px;
  color:var(--txt);font-size:12px;padding:1px 4px;outline:none;
  font-family:inherit;width:100%
}

/* ── Right Panel ── */
#rp{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Timeline header */
#thdr{
  height:var(--hh);overflow:hidden;flex-shrink:0;
  background:var(--surf);border-bottom:1px solid var(--sub);position:relative
}
#thdr-inner{position:absolute;top:0;left:0;height:100%;display:flex;align-items:stretch}
.hcell{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--txt3);
  border-right:1px solid var(--sub);
  flex-shrink:0;padding:0 4px;user-select:none;white-space:nowrap
}
.hcell.wknd{background:rgba(255,255,255,.018)}

/* Timeline body */
#tbody{flex:1;overflow:auto;position:relative}
#tcanvas{position:relative}

/* Timeline rows */
.trow{position:relative;height:var(--rh);border-bottom:1px solid var(--sub)}

/* ── Task Bars ── */
.bar{
  position:absolute;top:5px;height:calc(var(--rh) - 10px);
  border-radius:4px;border:1px solid var(--acc);
  background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(34,211,238,.1));
  cursor:grab;user-select:none;overflow:visible;min-width:4px;
  display:flex;align-items:center;transition:box-shadow .15s
}
.bar:hover{box-shadow:0 0 10px rgba(34,211,238,.3)}
.bar.sel{box-shadow:0 0 14px rgba(34,211,238,.5);border-color:#5eebff}
.bar.crit{
  background:linear-gradient(135deg,rgba(239,68,68,.28),rgba(239,68,68,.12));
  border-color:var(--red)
}
.bar.crit:hover,.bar.crit.sel{box-shadow:0 0 10px rgba(239,68,68,.35)}
.bar.dragging{opacity:.7;cursor:grabbing}
.bar-fill{
  position:absolute;left:0;top:0;bottom:0;
  background:rgba(34,211,238,.22);pointer-events:none;border-radius:3px 0 0 3px
}
.bar.crit .bar-fill{background:rgba(239,68,68,.22)}
.bar-lbl{
  position:relative;z-index:1;padding:0 6px;
  font-size:11px;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  pointer-events:none;max-width:100%
}
.bar-rsz{
  position:absolute;right:0;top:0;bottom:0;
  width:8px;cursor:col-resize;z-index:2
}
.bar-cr{
  position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;
  background:var(--acc);border:2px solid var(--bg);
  cursor:crosshair;z-index:10;opacity:0;transition:opacity .15s;pointer-events:all
}
.bar:hover .bar-cr{opacity:1}
.bar-cl{
  position:absolute;left:-6px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;
  background:var(--acc);border:2px solid var(--bg);
  z-index:10;opacity:0;transition:opacity .15s;pointer-events:none
}
.bar:hover .bar-cl{opacity:.55}

/* ── SVG Dependency Overlay ── */
#dep-svg{
  position:absolute;top:0;left:0;overflow:visible;z-index:4;
  pointer-events:none
}
#dep-svg .dep-hit{pointer-events:stroke;cursor:pointer}

/* ── JSON Sidebar ── */
#jside{
  width:280px;min-width:280px;
  border-left:1px solid var(--sub);background:var(--surf);
  display:flex;flex-direction:column;
  transition:width .2s,min-width .2s;overflow:hidden
}
#jside.col{width:0;min-width:0;border:none}
#jside-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;border-bottom:1px solid var(--sub);flex-shrink:0
}
#jside-hdr span{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em}
#jout{
  flex:1;overflow:auto;padding:8px;
  font-family:'Courier New',monospace;font-size:10.5px;
  color:var(--txt2);white-space:pre;line-height:1.5
}
#jimp-area{
  display:none;flex-direction:column;gap:5px;
  padding:8px;border-top:1px solid var(--sub)
}
#jimp-area.vis{display:flex}
#jimp-ta{
  height:110px;background:var(--bg);border:1px solid var(--sub);
  border-radius:4px;color:var(--txt);font-family:monospace;
  font-size:11px;padding:5px;resize:none;outline:none
}
#jimp-ta:focus{border-color:var(--acc)}

/* ── Dep preview line ── */
#dep-line{
  position:fixed;pointer-events:none;z-index:9999;
  display:none;overflow:visible
}
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <span class="logo">JExTile</span>
  <span class="logo-sub">Gantt</span>
  <div class="sep"></div>
  <button class="btn act" onclick="addTask()">+ Add Row</button>
  <div class="sep"></div>
  <div class="zg">
    <button class="zb" id="zd" onclick="setZoom('day')">Day</button>
    <button class="zb act" id="zw" onclick="setZoom('week')">Week</button>
    <button class="zb" id="zm" onclick="setZoom('month')">Month</button>
  </div>
  <div class="spacer"></div>
  <button class="btn" onclick="toggleJSON()">{ } JSON</button>
</div>

<!-- Main -->
<div id="main">

  <!-- Left Panel -->
  <div id="lp">
    <div id="lh">
      <div class="lhc" style="flex:1">Task</div>
      <div class="lhc" style="width:80px">Assigned</div>
      <div class="lhc" style="width:42px;text-align:center">Dur</div>
      <div class="lhc" style="width:36px;text-align:center">%</div>
      <div style="width:28px"></div>
    </div>
    <div id="lb"></div>
  </div>

  <!-- Right Panel -->
  <div id="rp">
    <div id="thdr"><div id="thdr-inner"></div></div>
    <div id="tbody">
      <div id="tcanvas">
        <svg id="dep-svg"></svg>
      </div>
    </div>
  </div>

  <!-- JSON Sidebar -->
  <div id="jside">
    <div id="jside-hdr">
      <span>JSON Output</span>
      <div style="display:flex;gap:4px">
        <button class="btn" style="padding:2px 7px;font-size:11px" onclick="exportJSON()">Copy</button>
        <button class="btn" style="padding:2px 7px;font-size:11px" onclick="toggleImport()">Import</button>
      </div>
    </div>
    <div id="jout"></div>
    <div id="jimp-area">
      <textarea id="jimp-ta" placeholder="Paste JSON array…"></textarea>
      <div style="display:flex;gap:4px">
        <button class="btn act" style="flex:1;font-size:11px" onclick="doImport()">Apply</button>
        <button class="btn" style="font-size:11px" onclick="toggleImport()">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Dependency preview SVG (fixed, follows cursor) -->
<svg id="dep-line" width="1" height="1">
  <line id="dep-line-el" x1="0" y1="0" x2="0" y2="0"
    stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3"/>
</svg>

<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const DAY_W = { day: 30, week: 14, month: 4 };
const ROW_H = 36;

let zoom   = 'week';
let tasks  = [];
let selId  = null;
let jsonOpen = true;
let critSet  = new Set();
let originDate = null;
let dragState  = null;
let syncScroll = false;

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function uuid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function toD(s)    { return new Date(s + 'T00:00:00'); }
function toS(d)    { return d.toISOString().slice(0, 10); }
function addD(d,n) { const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function diffD(a,b){ return Math.round((b-a)/86400000); }
function esc(s)    { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dw()      { return DAY_W[zoom]; }

// ═══════════════════════════════════════════
//  TIMELINE MATH
// ═══════════════════════════════════════════
function computeOrigin() {
  if (!tasks.length) return toD('2026-02-24');
  const min = tasks.reduce((m,t) => t.startDate < m ? t.startDate : m, tasks[0].startDate);
  return addD(toD(min), -7);
}
function dateToX(s) { return diffD(originDate, toD(s)) * dw(); }
function xToDate(x) { return toS(addD(originDate, Math.round(x / dw()))); }
function totalDays() {
  if (!tasks.length) return 90;
  const max = tasks.reduce((m,t) => t.endDate > m ? t.endDate : m, tasks[0].endDate);
  return Math.max(90, diffD(originDate, toD(max)) + 30);
}

// ═══════════════════════════════════════════
//  CRITICAL PATH  (forward / backward pass)
// ═══════════════════════════════════════════
function computeCritical() {
  if (!tasks.length) return new Set();
  const map = {};
  tasks.forEach((t,i) => { map[t.id] = {...t, _i: i}; });

  // forward pass: earliest finish (in duration-days from project start)
  const ef = {};
  function getEF(id, seen = new Set()) {
    if (ef[id] !== undefined) return ef[id];
    if (seen.has(id)) { ef[id] = 0; return 0; }
    const ns = new Set([...seen, id]);
    const t = map[id]; if (!t) { ef[id] = 0; return 0; }
    const predMax = t.predecessors.reduce((m,p) => Math.max(m, getEF(p.id, ns)), 0);
    ef[id] = predMax + t.duration;
    return ef[id];
  }
  tasks.forEach(t => getEF(t.id));

  const maxEF = Math.max(0, ...tasks.map(t => ef[t.id] || 0));
  if (!maxEF) return new Set();

  // successor map
  const succMap = {};
  tasks.forEach(t => { succMap[t.id] = []; });
  tasks.forEach(t => t.predecessors.forEach(p => { if (succMap[p.id]) succMap[p.id].push(t.id); }));

  // backward pass: latest finish
  const lf = {};
  function getLF(id, seen = new Set()) {
    if (lf[id] !== undefined) return lf[id];
    if (seen.has(id)) { lf[id] = maxEF; return maxEF; }
    const ns = new Set([...seen, id]);
    const succs = succMap[id] || [];
    if (!succs.length) { lf[id] = maxEF; return maxEF; }
    lf[id] = succs.reduce((m, sid) => {
      const st = map[sid];
      return Math.min(m, getLF(sid, ns) - (st ? st.duration : 0));
    }, maxEF);
    return lf[id];
  }
  tasks.forEach(t => getLF(t.id));

  const crit = new Set();
  tasks.forEach(t => { if ((lf[t.id] || 0) - (ef[t.id] || 0) <= 0) crit.add(t.id); });
  return crit;
}

// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════
function render() {
  originDate = computeOrigin();
  critSet    = computeCritical();
  renderLeft();
  renderTimeline();
  renderSVG();
  updateJSON();
}

// ── Left panel rows ──
function renderLeft() {
  document.getElementById('lb').innerHTML = tasks.map(t => `
    <div class="lrow${t.id===selId?' sel':''}${critSet.has(t.id)?' crit':''}"
         data-id="${t.id}" onclick="selTask('${t.id}')">
      <div class="lc-name" ondblclick="editCell(event,'${t.id}','name')"
           title="${esc(t.name)}">${esc(t.name)}</div>
      <div class="lc-who" ondblclick="editCell(event,'${t.id}','assignedTo')"
           title="${esc(t.assignedTo)}">${esc(t.assignedTo||'')}</div>
      <div class="lc-dur">${t.duration}d</div>
      <div class="lc-pct">${t.percentComplete}%</div>
      <div class="lc-del">
        <button class="delbtn" onclick="delTask('${t.id}');event.stopPropagation()" title="Delete row">×</button>
      </div>
    </div>`).join('');
}

// ── Timeline bars ──
function renderTimeline() {
  const days = totalDays();
  const W    = days * dw();

  // Header
  const hdrInner = document.getElementById('thdr-inner');
  hdrInner.style.width = W + 'px';
  hdrInner.innerHTML = buildHeaderCells(days);

  // Canvas
  const tc = document.getElementById('tcanvas');
  tc.style.width    = W + 'px';
  tc.style.minHeight = (tasks.length * ROW_H) + 'px';

  // Grid via CSS repeating-gradient
  const step = zoom==='day' ? 1 : zoom==='week' ? 7 : 30;
  tc.style.backgroundImage =
    `repeating-linear-gradient(90deg,var(--sub) 0,var(--sub) 1px,transparent 1px,transparent ${step*dw()}px)`;
  tc.style.backgroundSize = `${step*dw()}px ${ROW_H}px`;

  // Build rows HTML
  let rowsHTML = '';
  tasks.forEach((t, i) => {
    const x     = dateToX(t.startDate);
    const bw    = Math.max(4, t.duration * dw());
    const fillW = Math.round(bw * t.percentComplete / 100);
    const isCrit = critSet.has(t.id);
    const isSel  = t.id === selId;

    rowsHTML += `
      <div class="trow" data-id="${t.id}">
        <div class="bar${isCrit?' crit':''}${isSel?' sel':''}"
             style="left:${x}px;width:${bw}px" data-id="${t.id}">
          <div class="bar-fill" style="width:${fillW}px"></div>
          <span class="bar-lbl">${esc(t.name)}</span>
          <div class="bar-rsz" data-action="resize" data-id="${t.id}"></div>
          <div class="bar-cr"  data-action="connect" data-id="${t.id}"></div>
          <div class="bar-cl"></div>
        </div>
      </div>`;
  });

  // Preserve SVG element, rebuild rest
  const svg = document.getElementById('dep-svg');
  tc.innerHTML = rowsHTML;
  tc.appendChild(svg);

  attachBarEvents();
}

// ── Header cells ──
function buildHeaderCells(days) {
  const d = dw();
  let html = '', i = 0;
  if (zoom === 'day') {
    while (i < days) {
      const dt  = addD(originDate, i);
      const we  = dt.getDay()===0 || dt.getDay()===6;
      const lbl = dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
      html += `<div class="hcell${we?' wknd':''}" style="width:${d}px">${lbl}</div>`;
      i++;
    }
  } else if (zoom === 'week') {
    while (i < days) {
      const dt  = addD(originDate, i);
      const lbl = dt.toLocaleDateString('en-US', {month:'short', day:'numeric'});
      html += `<div class="hcell" style="width:${7*d}px">${lbl}</div>`;
      i += 7;
    }
  } else {
    while (i < days) {
      const dt  = addD(originDate, i);
      const dim = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate();
      const lbl = dt.toLocaleDateString('en-US', {month:'short', year:'2-digit'});
      html += `<div class="hcell" style="width:${dim*d}px">${lbl}</div>`;
      i += dim;
    }
  }
  return html;
}

// ── SVG Dependency Arrows ──
function renderSVG() {
  const svg = document.getElementById('dep-svg');
  if (!svg) return;

  const tc = document.getElementById('tcanvas');
  const W  = parseInt(tc.style.width) || 800;
  const H  = Math.max(tasks.length * ROW_H, 100);
  svg.setAttribute('width',  W);
  svg.setAttribute('height', H);
  svg.style.cssText = 'position:absolute;top:0;left:0;overflow:visible;z-index:4;pointer-events:none';

  const map = {};
  tasks.forEach((t,i) => { map[t.id] = {...t, _i: i}; });
  const DW = dw();

  const COLOR  = { FS:'#3b82f6', FF:'#22c55e', SS:'#f97316', SF:'#ef4444' };
  const MARKER = { FS:'mk-fs',   FF:'mk-ff',   SS:'mk-ss',   SF:'mk-sf'   };

  const defs = `<defs>
    ${Object.entries(COLOR).map(([k,c]) =>
      `<marker id="${MARKER[k]}" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
        <path d="M0,0 L7,3.5 L0,7 Z" fill="${c}"/>
      </marker>`
    ).join('')}
  </defs>`;

  let paths = '';
  tasks.forEach(t => {
    t.predecessors.forEach(pred => {
      const src = map[pred.id]; if (!src) return;
      const ty  = pred.type || 'FS';
      const c   = COLOR[ty]  || COLOR.FS;
      const mk  = MARKER[ty] || MARKER.FS;

      const sx = dateToX(src.startDate), sw = Math.max(4, src.duration * DW);
      const tx = dateToX(t.startDate),   tw = Math.max(4, t.duration   * DW);
      const sy = src._i * ROW_H + ROW_H / 2;
      const ty2 = map[t.id]._i * ROW_H + ROW_H / 2;

      let x1, y1, x2, y2;
      if      (ty==='FS') { x1=sx+sw; y1=sy; x2=tx;    y2=ty2; }
      else if (ty==='FF') { x1=sx+sw; y1=sy; x2=tx+tw; y2=ty2; }
      else if (ty==='SS') { x1=sx;    y1=sy; x2=tx;    y2=ty2; }
      else                { x1=sx;    y1=sy; x2=tx+tw; y2=ty2; } // SF

      const off = Math.max(20, Math.abs(x2-x1)*0.35);
      const cx1=x1+off, cx2=x2-off;
      const d = `M${x1},${y1} C${cx1},${y1} ${cx2},${y2} ${x2},${y2}`;

      paths += `
        <path d="${d}" stroke="${c}" stroke-width="1.5" fill="none"
              marker-end="url(#${mk})"
              data-from="${pred.id}" data-to="${t.id}" data-type="${ty}"/>
        <path class="dep-hit" d="${d}"
              stroke="rgba(0,0,0,0)" stroke-width="10" fill="none"
              data-from="${pred.id}" data-to="${t.id}" data-type="${ty}"
              style="pointer-events:stroke"/>`;
    });
  });

  svg.innerHTML = defs + paths;

  // Attach right-click delete to hit paths
  svg.querySelectorAll('.dep-hit').forEach(el => {
    el.addEventListener('contextmenu', e => {
      e.preventDefault(); e.stopPropagation();
      const from = e.target.dataset.from;
      const to   = e.target.dataset.to;
      const ty   = e.target.dataset.type;
      if (confirm(`Delete ${ty} dependency?`)) delDep(from, to);
    });
  });
}

// ═══════════════════════════════════════════
//  BAR INTERACTION EVENTS
// ═══════════════════════════════════════════
function attachBarEvents() {
  document.querySelectorAll('.bar').forEach(bar => {
    const id = bar.dataset.id;

    bar.addEventListener('mousedown', e => {
      const act = e.target.dataset.action;
      if (act === 'resize' || act === 'connect') return; // handled by children
      e.preventDefault();
      selTask(id);
      const t = tasks.find(t => t.id === id); if (!t) return;
      dragState = { type:'bar', id, startX:e.clientX, origStart:t.startDate, origEnd:t.endDate };
      bar.classList.add('dragging');
    });

    // Resize handle
    const rsz = bar.querySelector('[data-action="resize"]');
    rsz && rsz.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      selTask(id);
      const t = tasks.find(t => t.id === id); if (!t) return;
      dragState = { type:'resize', id, startX:e.clientX, origDur:t.duration };
    });

    // Right connector → draw arrow
    const cr = bar.querySelector('[data-action="connect"]');
    cr && cr.addEventListener('mousedown', e => {
      e.preventDefault(); e.stopPropagation();
      dragState = { type:'arrow', fromId:id, startX:e.clientX, startY:e.clientY };
      const ln = document.getElementById('dep-line');
      ln.style.display = 'block';
      ln.setAttribute('viewBox', '0 0 10000 10000');
      ln.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;overflow:visible;display:block';
      const line = document.getElementById('dep-line-el');
      line.setAttribute('x1', e.clientX); line.setAttribute('y1', e.clientY);
      line.setAttribute('x2', e.clientX); line.setAttribute('y2', e.clientY);
    });
  });
}

// ── Global mouse move ──
document.addEventListener('mousemove', e => {
  if (!dragState) return;

  if (dragState.type === 'bar') {
    const dx = e.clientX - dragState.startX;
    const dd = Math.round(dx / dw());
    const t  = tasks.find(t => t.id === dragState.id); if (!t) return;
    t.startDate = toS(addD(toD(dragState.origStart), dd));
    t.endDate   = toS(addD(toD(dragState.origEnd),   dd));
    // Fast-path: update bar position without full re-render
    const bar = document.querySelector(`.bar[data-id="${dragState.id}"]`);
    if (bar) bar.style.left = dateToX(t.startDate) + 'px';
    renderSVG();
    updateJSON();

  } else if (dragState.type === 'resize') {
    const dx = e.clientX - dragState.startX;
    const dd = Math.round(dx / dw());
    const t  = tasks.find(t => t.id === dragState.id); if (!t) return;
    t.duration = Math.max(1, dragState.origDur + dd);
    t.endDate  = toS(addD(toD(t.startDate), t.duration));
    const bar  = document.querySelector(`.bar[data-id="${dragState.id}"]`);
    if (bar) bar.style.width = Math.max(4, t.duration * dw()) + 'px';
    renderSVG();
    updateJSON();

  } else if (dragState.type === 'arrow') {
    const line = document.getElementById('dep-line-el');
    line.setAttribute('x2', e.clientX);
    line.setAttribute('y2', e.clientY);
  }
});

// ── Global mouse up ──
document.addEventListener('mouseup', e => {
  if (!dragState) return;

  if (dragState.type === 'bar' || dragState.type === 'resize') {
    document.querySelectorAll('.bar.dragging').forEach(b => b.classList.remove('dragging'));
    render();

  } else if (dragState.type === 'arrow') {
    document.getElementById('dep-line').style.display = 'none';
    // Check if dropped on a bar
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetBar = el && el.closest('.bar');
    if (targetBar) {
      const toId = targetBar.dataset.id;
      if (toId && toId !== dragState.fromId) {
        const toTask = tasks.find(t => t.id === toId);
        if (toTask && !toTask.predecessors.some(p => p.id === dragState.fromId)) {
          toTask.predecessors.push({ id: dragState.fromId, type: 'FS' });
          render();
        }
      }
    }
  }

  dragState = null;
});

// ═══════════════════════════════════════════
//  TASK ACTIONS
// ═══════════════════════════════════════════
function selTask(id) {
  selId = id;
  document.querySelectorAll('.lrow,.bar').forEach(el => {
    el.classList.toggle('sel', el.dataset.id === id);
  });
}

function addTask() {
  const start = toS(new Date());
  tasks.push({
    id:              uuid(),
    name:            'New Task',
    startDate:       start,
    endDate:         toS(addD(new Date(), 7)),
    duration:        7,
    percentComplete: 0,
    assignedTo:      '',
    predecessors:    [],
    successors:      [],
    rowIndex:        tasks.length
  });
  render();
}

function delTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  tasks.forEach(t => {
    t.predecessors = t.predecessors.filter(p => p.id !== id);
    t.successors   = t.successors.filter(s => s.id !== id);
  });
  if (selId === id) selId = null;
  render();
}

function delDep(fromId, toId) {
  const t = tasks.find(t => t.id === toId);
  if (t) t.predecessors = t.predecessors.filter(p => p.id !== fromId);
  render();
}

// ═══════════════════════════════════════════
//  INLINE EDIT  (double-click a left cell)
// ═══════════════════════════════════════════
function editCell(e, id, field) {
  e.stopPropagation();
  const cell = e.currentTarget;
  const t    = tasks.find(t => t.id === id); if (!t) return;
  const orig = t[field] != null ? t[field] : '';

  const isNum = field === 'duration' || field === 'percentComplete';
  cell.innerHTML = `<input class="cinput" value="${esc(String(orig))}"
    type="${isNum ? 'number' : 'text'}"
    ${field==='percentComplete' ? 'min="0" max="100"' : ''}
    ${field==='duration' ? 'min="1"' : ''}>`;
  const inp = cell.querySelector('input');
  inp.focus(); inp.select();

  const save = () => {
    let v = inp.value;
    if (field === 'duration') {
      v = Math.max(1, parseInt(v) || 1);
      t.duration  = v;
      t.endDate   = toS(addD(toD(t.startDate), v));
    } else if (field === 'percentComplete') {
      v = Math.min(100, Math.max(0, parseInt(v) || 0));
      t.percentComplete = v;
    } else {
      t[field] = v;
    }
    render();
  };

  inp.addEventListener('blur',    save);
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter')  inp.blur();
    if (ev.key === 'Escape') { t[field] = orig; render(); }
  });
}

// ═══════════════════════════════════════════
//  ZOOM
// ═══════════════════════════════════════════
function setZoom(z) {
  zoom = z;
  ['d','w','m'].forEach(k => document.getElementById('z'+k).classList.remove('act'));
  document.getElementById('z'+z[0]).classList.add('act');
  render();
}

// ═══════════════════════════════════════════
//  JSON SIDEBAR
// ═══════════════════════════════════════════
function toggleJSON() {
  jsonOpen = !jsonOpen;
  document.getElementById('jside').classList.toggle('col', !jsonOpen);
}

function updateJSON() {
  if (!jsonOpen) return;
  document.getElementById('jout').textContent = JSON.stringify(tasks, null, 2);
}

function exportJSON() {
  const txt = JSON.stringify(tasks, null, 2);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(() => alert('Copied to clipboard!'));
  } else {
    prompt('Copy JSON:', txt);
  }
}

function toggleImport() {
  document.getElementById('jimp-area').classList.toggle('vis');
}

function doImport() {
  try {
    const arr = JSON.parse(document.getElementById('jimp-ta').value);
    if (!Array.isArray(arr)) throw new Error('Must be a JSON array');
    tasks = arr.map(t => ({
      id:              t.id              || uuid(),
      name:            t.name            || 'Task',
      startDate:       t.startDate       || toS(new Date()),
      endDate:         t.endDate         || toS(addD(new Date(), 7)),
      duration:        t.duration        || 7,
      percentComplete: t.percentComplete || 0,
      assignedTo:      t.assignedTo      || '',
      predecessors:    t.predecessors    || [],
      successors:      t.successors      || [],
      rowIndex:        t.rowIndex        || 0
    }));
    toggleImport();
    render();
  } catch (err) { alert('Invalid JSON: ' + err.message); }
}

tbodyEl.addEventListener('scroll', () => {
  if (syncScroll) return;
  syncScroll = true;
  lbEl.scrollTop     = tbodyEl.scrollTop;
  thdrInner.style.left = (-tbodyEl.scrollLeft) + 'px';
  syncScroll = false;
});

lbEl.addEventListener('scroll', () => {
  if (syncScroll) return;
  syncScroll = true;
  tbodyEl.scrollTop = lbEl.scrollTop;
  syncScroll = false;
});

// Right-click on dep arrows (bubbling fallback)
document.getElementById('tcanvas').addEventListener('contextmenu', e => {
  const el = e.target;
  if (el && el.dataset && el.dataset.from) {
    e.preventDefault();
    if (confirm(`Delete ${el.dataset.type||'FS'} dependency?`)) {
      delDep(el.dataset.from, el.dataset.to);
    }
  }
});
